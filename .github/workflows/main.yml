name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android --project-name weed --org com.weed .

      - name: Apply UMP Android config
        run: |
          mkdir -p android/app/src/main/res/xml
          cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android_overrides/automotive_app_desc.xml android/app/src/main/res/xml/automotive_app_desc.xml
          F=$(find android/app/src/main -name MainActivity.kt | head -n 1)
          cp android_overrides/MainActivity.kt "$F"

      - run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ump-apk
          path: build/app/outputs/flutter-apk/app-release.apk
